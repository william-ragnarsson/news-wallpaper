<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream Explorer</title>
  <link rel="stylesheet" href="./explorer.css">
  <script type="module" src="./explorer.js"></script>
</head>
<body>
  <!-- Three panes: outlets (with a link to the wallpaper), the selected outlet's streams, and the selected stream's normalized items. -->
  <div id="explorer">
    <nav id="outlets" aria-label="Outlets"></nav>
    <nav id="streams" aria-label="Streams"></nav>
    <main id="stream"></main>
  </div>
</body>
</html>
