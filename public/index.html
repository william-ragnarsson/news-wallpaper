<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News Wallpaper</title>
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" id="preset-css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="stage">
    <!-- #desktop is the simulated Mac screen. Everything inside #wallpaper is the wallpaper itself;
         #mac-chrome is a fake menu bar and Dock drawn on top so the design can be judged in context. -->
    <div id="desktop">
      <main id="wallpaper"></main>
      <div id="mac-chrome" aria-hidden="true">
        <div class="menubar">
          <div class="menubar-left">
            <svg viewBox="0 0 24 24" class="menubar-icon apple"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
            <b>Finder</b><span>Archief</span><span>Wijzig</span><span>Weergave</span><span>Ga</span><span>Venster</span><span>Help</span>
          </div>
          <div class="menubar-right">
            <svg viewBox="0 0 20 14" class="menubar-icon"><path d="M10 13.2 1.2 4.6a12.4 12.4 0 0 1 17.6 0Z" fill="currentColor"/></svg>
            <svg viewBox="0 0 28 14" class="menubar-icon battery"><rect x="1" y="1.5" width="22" height="11" rx="3.2" fill="none" stroke="currentColor" stroke-opacity=".55"/><rect x="3" y="3.5" width="15" height="7" rx="1.6" fill="currentColor"/><rect x="24.5" y="5" width="1.8" height="4" rx=".9" fill="currentColor" fill-opacity=".55"/></svg>
            <svg viewBox="0 0 16 16" class="menubar-icon"><circle cx="5" cy="5" r="2.6" fill="currentColor"/><circle cx="11" cy="11" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="8.2" y="2.6" width="6" height="4.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="1.8" y="8.6" width="6" height="4.8" rx="2.4" fill="currentColor"/></svg>
            <span class="menubar-clock" id="menubar-clock"></span>
          </div>
        </div>
        <div class="dock" id="dock"></div>
      </div>
    </div>
  </div>

  <aside id="hud" hidden></aside>
  <div id="toast" role="status"></div>
</body>
</html>
