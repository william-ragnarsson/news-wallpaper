<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customize</title>
  <link rel="stylesheet" href="./customize.css">
  <script type="module" src="./customize.js"></script>
</head>
<body>
  <header id="top">
    <h1>Customize</h1>
    <nav aria-label="Pages">
      <a href="/">Wallpaper</a>
      <a href="/explorer/">Data explorer</a>
    </nav>
    <p id="status" role="status"></p>
  </header>

  <!-- Settings on the left, the wallpaper itself on the right. Every change saves at once. -->
  <div id="customize">
    <main id="settings"><p class="empty">Loading settings…</p></main>
    <aside id="preview" aria-labelledby="preview-title">
      <p class="preview-head"><span id="preview-title">Preview</span><span class="muted">MacBook Pro 14″ · 1512 × 982</span></p>
      <!-- The wallpaper follows the saved settings over its own event stream, so this frame never reloads. -->
      <iframe src="/?hud=0&amp;screen=1512x982" title="Wallpaper preview" inert></iframe>
      <p id="preview-links" class="preview-links"></p>
    </aside>
  </div>
</body>
</html>
